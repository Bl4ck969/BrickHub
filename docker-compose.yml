services:
  brickhub:
    build: .
    image: brickhub:latest
    container_name: brickhub
    ports:
      - "8080:8080"
    volumes:
      # Data directory (database + uploaded images) - survives container updates
      - ./backend/data:/app/data
      # Export directory (PDFs, JSON exports)
      - ./backend/export:/app/export
    env_file:
      - backend/.env
    mem_limit: 4g
    restart: unless-stopped
    # Kein healthcheck-Block hier: Der Healthcheck steht im Dockerfile und wird
    # daraus geerbt. Der frühere Block rief "curl", das im Image gar nicht
    # installiert ist – er hätte den Container dauerhaft als unhealthy gemeldet.
