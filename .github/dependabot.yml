# Von Claude Code eingerichtet: beobachtet NUR das Docker-Base-Image (FROM ...)
# und schlaegt bei einer neueren Version einen Pull Request vor (max. 2, monatlich).
# Aendert nichts automatisch - jeder PR muss manuell gemergt werden.
# npm/pip-Schwachstellen laufen ueber Dependabot-Alerts + das 2-Wochen-Audit-Issue.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker-base-image"
