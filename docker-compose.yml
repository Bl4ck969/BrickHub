services:
  brickhub:
    build: .
    image: brickhub:latest
    container_name: brickhub
    ports:
      - "8080:8080"
    volumes:
      # Data directory (database + uploaded images) - survives container updates
      - ./backend/data:/app/data
      # Export directory (PDFs, JSON exports)
      - ./backend/export:/app/export
    env_file:
      - backend/.env
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
