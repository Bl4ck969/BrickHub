<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brick-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16243b" />
    <title>BrickHub</title>
    <script>
      // Laeuft vor React und vor dem ersten Anstrich: ohne das blitzt beim
      // Laden kurz das falsche Theme auf. Gemerkte Wahl schlaegt System.
      (function () {
        try {
          var gewaehlt = localStorage.getItem('brickhub-theme')
          var dunkel =
            gewaehlt === 'dark' ||
            (gewaehlt !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dunkel)
        } catch (e) {
          // Privates Fenster oder gesperrte Speicherung: dann eben hell.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
